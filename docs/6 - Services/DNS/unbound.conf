# Unbound 1.25.2 - condensed config
# Full reference: unbound.conf(5). Commented lines show the default value.

server:
	# ---- Logging / stats ----
	# verbosity: 1
	# use-syslog: yes
	# logfile: ""                     # "" = stderr
	# log-queries: no
	# log-replies: no
	# log-servfail: no
	# statistics-interval: 0          # seconds, 0 = disabled
	# extended-statistics: no         # per-qtype/rcode counters
	# statistics-cumulative: no
	val-log-level: 2                  # 0 off, 1 line per failed query, 2 + reason and bad IP

	# ---- Performance ----
	num-threads: 4
	# msg-cache-size: 4m
	# rrset-cache-size: 4m
	# key-cache-size: 4m
	# neg-cache-size: 1m
	# outgoing-range: 4096
	# num-queries-per-thread: 2048
	# so-reuseport: yes
	# prefetch: no
	# prefetch-key: no

	# ---- Network ----
	interface: 192.168.2.53
	interface: 127.0.0.1
	#interface: 192.168.1.53
	# interface: 0.0.0.0              # all interfaces (also set interface-automatic: yes)
	# port: 53
	# outgoing-interface: <ip>        # source IP for upstream queries
	outgoing-port-permit: 32768-60999
	# outgoing-port-avoid: "3200-3208"
	do-ip4: yes
	do-ip6: no
	prefer-ip4: yes
	# prefer-ip6: no
	do-udp: yes
	do-tcp: yes
	# tcp-upstream: no
	# tcp-idle-timeout: 30000
	# edns-buffer-size: 1232
	# max-udp-size: 1232
	# ip-transparent: no
	# ip-freebind: no
	# use-systemd: no
	# do-daemonize: yes               # set to no under systemd

	# ---- Access control ----
	# Actions: deny (drop), refuse, allow, allow_setrd, allow_snoop,
	#          allow_cookie, deny_non_local, refuse_non_local
	access-control: 127.0.0.0/8 allow
	access-control: 192.168.0.0/16 allow
	# access-control-tag / -tag-action / -tag-data / -view: per-netblock tags and views
	interface-action: 192.168.2.53 allow
	interface-action: 127.0.0.1 allow
	# interface-tag / -tag-action / -tag-data / -view: same, per interface
	# NB: access-control overrides interface-* for matching clients

	# ---- Process / privileges ----
	# chroot: ""
	# username: "unbound"
	# directory: ""
	# root-hints: ""                  # https://www.internic.net/domain/named.cache

	# ---- Privacy / hardening ----
	# hide-identity: no
	# hide-version: no
	# hide-trustanchor: no
	# identity: ""
	# version: ""
	# qname-minimisation: yes
	# qname-minimisation-strict: no
	# aggressive-nsec: yes
	# use-caps-for-id: no             # dns-0x20
	# caps-exempt: "example.com"
	# harden-short-bufsize: yes
	# harden-large-queries: no
	# harden-glue: yes
	# harden-unverified-glue: no
	# harden-dnssec-stripped: yes
	# harden-below-nxdomain: yes
	# harden-referral-path: no
	# harden-algo-downgrade: no
	# harden-unknown-additional: no
	# private-address: 192.168.0.0/16 # strip from answers (DNS rebinding), repeatable
	# private-domain: "example.com"   # exempt from private-address
	unwanted-reply-threshold: 10000000  # flush cache if reached (0 = off)
	# do-not-query-localhost: yes
	# deny-any: no

	# ---- Cache / answers ----
	# cache-min-ttl: 0
	# cache-max-ttl: 86400
	# cache-max-negative-ttl: 3600
	# serve-expired: no
	# serve-expired-ttl: 86400
	# serve-expired-reply-ttl: 30
	# serve-expired-client-timeout: 1800
	# rrset-roundrobin: yes
	# minimal-responses: yes
	# infra-host-ttl: 900
	# ratelimit: 0                    # qps per zone, 0 = off
	# ip-ratelimit: 0                 # qps per client IP, 0 = off
	ede: yes                          # Extended DNS Errors (RFC 8914)
	ede-serve-expired: yes

	# ---- DNSSEC ----
	trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"
	# auto-trust-anchor-file: ""      # RFC 5011 auto-update (run unbound-anchor first)
	# trust-anchor: "<DS or DNSKEY RR>"
	# domain-insecure: "example.com"  # skip validation for this zone
	# val-permissive-mode: no         # yes = DISABLES DNSSEC enforcement
	# val-bogus-ttl: 60
	# val-clean-additional: yes
	# val-sig-skew-min: 3600
	# val-sig-skew-max: 86400
	# ignore-cd-flag: no
	# disable-edns-do: no

	# ---- Local zones / data ----
	# local-zone: "example.lan." static
	# local-data: "host.example.lan. IN A 192.0.2.51"
	# local-data-ptr: "192.0.2.51 host.example.lan"
	# Zone types: deny, refuse, static, transparent, redirect, nodefault,
	#   typetransparent, inform, always_null/nxdomain/nodata/refuse/deny, ...
	# local-zone: "<zone>" nodefault # unblock a built-in AS112 zone (10.in-addr.arpa.,
	#                                # 168.192.in-addr.arpa., 16-31.172.in-addr.arpa., ...)
	# unblock-lan-zones: no
	# insecure-lan-zones: no

	# ---- DoT / DoH (server side) + TLS upstream ----
	# tls-service-key: "/path/key.pem"
	# tls-service-pem: "/path/cert.pem"
	# tls-port: 853
	# https-port: 443
	# http-endpoint: "/dns-query"
	# tls-upstream: no
	# tls-cert-bundle: ""
	# tls-system-cert: no
	# tls-protocols: "TLSv1.2 TLSv1.3"
	# pad-responses: yes
	# pad-queries: yes

	# ---- Misc ----
	# module-config: "validator iterator"
	# target-fetch-policy: "3 2 1 0 0"
	# define-tag: "tag1 tag2"

remote-control:
	control-enable: yes
	control-interface: /run/unbound.control.sock
	# control-port: 8953
	# control-use-cert: "yes"

# ---- Stub / forward zones ----
# stub-zone:
#	name: "example.com"
#	stub-addr: 192.0.2.68
#	stub-first: no
# forward-zone:                     # name "." forwards everything
#	name: "example.com"
#	forward-addr: 192.0.2.68
#	forward-first: no
#	forward-tls-upstream: no

# ---- Views ----
# view:
#	name: "viewname"
#	local-zone: "example.com" redirect
#	local-data: "example.com A 192.0.2.3"
#	view-first: no

# ---- Authority zones (local copy of the root) ----
auth-zone:
	name: "."
	primary: 170.247.170.2        # b.root-servers.net
	primary: 192.33.4.12          # c.root-servers.net
	primary: 199.7.91.13          # d.root-servers.net
	primary: 192.5.5.241          # f.root-servers.net
	primary: 192.112.36.4         # g.root-servers.net
	primary: 193.0.14.129         # k.root-servers.net
	fallback-enabled: yes
	for-downstream: no
	for-upstream: yes

# ---- Optional modules (need compile-time flags, see unbound.conf(5)) ----
# python / dynlib, dnscrypt, cachedb (redis), ipset, dnstap, rpz, ipsecmod

include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"
